<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Video Background - Vintage Poster</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      background-color: #0d0d0d;
      overflow-x: hidden;
    }

    /* Container dos vídeos de fundo */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: -1;
      background-color: #000000;
    }

    /* Estilo base para os dois elementos de vídeo */
    .video-background video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: opacity 0.6s ease-in-out;
      will-change: opacity;
    }

    #bg-main {
      opacity: 1;
      z-index: 1;
    }

    #bg-accent {
      opacity: 0;
      z-index: 2;
    }

    /* Filtro escuro para legibilidade do conteúdo */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 3;
      pointer-events: none;
    }

    /* Container de alinhamento ao centro */
    .content-container {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    /* Container do cartaz centralizado */
    .poster-container {
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
      display: inline-block;
    }

    .poster-container:hover {
      transform: scale(1.02);
    }

    .poster-img {
      max-width: 90vw;
      max-height: 85vh;
      width: auto;
      height: auto;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      .video-background video {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Camada de Vídeos de Fundo -->
  <div class="video-background">
    <video id="bg-main" autoplay loop muted playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
      <source src="https://raw.githubusercontent.com/jzdigitalmarket/javashow/main/background-720p.mp4" type="video/mp4">
    </video>

    <video id="bg-accent" muted playsinline preload="auto">
      <source src="https://raw.githubusercontent.com/jzdigitalmarket/javashow/main/background-720p.webm" type="video/webm">
    </video>

    <div class="video-overlay"></div>
  </div>

  <!-- Cartaz Centralizado -->
  <main class="content-container">
    <div class="poster-container" id="interactive-card">
      <img src="https://raw.githubusercontent.com/jzdigitalmarket/javashow/main/25comandosia.jpg" alt="25 Ordens para a Fotografia de Produtos com AI" class="poster-img">
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bgMain = document.getElementById('bg-main');
      const bgAccent = document.getElementById('bg-accent');
      const interactiveCard = document.getElementById('interactive-card');

      let isPlayingAccent = false;

      bgAccent.load();

      function triggerAccentVideo() {
        if (isPlayingAccent) return;
        isPlayingAccent = true;

        bgAccent.currentTime = 0;

        const playPromise = bgAccent.play();

        if (playPromise !== undefined) {
          playPromise.then(() => {
            bgAccent.style.opacity = '1';
            bgMain.style.opacity = '0';
          }).catch(error => {
            console.warn('Bloqueio de reprodução detectado:', error);
            isPlayingAccent = false;
          });
        }
      }

      bgAccent.addEventListener('ended', () => {
        bgAccent.style.opacity = '0';
        bgMain.style.opacity = '1';

        setTimeout(() => {
          isPlayingAccent = false;
        }, 600);
      });

      if (interactiveCard) {
        interactiveCard.addEventListener('mouseenter', triggerAccentVideo);
        interactiveCard.addEventListener('click', triggerAccentVideo);
      }
    });
  </script>
</body>
</html>
