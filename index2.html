allback) {\n    const block = particleSet.getBlockByName(blockName);\n    if (block) {\n      block.valueCallback = callback;\n    }\n  }\n  function setupAnimations() {\n    const camera = scene.activeCamera;\n    const insetFactor = 0.8;\n    const emitterLoopDuration = 20;\n    const attractorLoopDuration = 8;\n    let elapsed = 0;\n    scene.onBeforeRenderObservable.add(() => {\n      if (particleSystems.length === 0 || !particleSystems[0].emitter) return;\n      const particles = particleSystems[0];\n      const dt = engine.getDeltaTime() / 1e3;\n      elapsed += dt;\n      const left = camera.orthoLeft * insetFactor;\n      const right = camera.orthoRight * insetFactor;\n      const top = camera.orthoTop * insetFactor;\n      const bottom = camera.orthoBottom * insetFactor;\n      const width = right - left;\n      const height = top - bottom;\n      animateEmitterOnRectangle(\n        particles.emitter,\n        elapsed,\n        emitterLoopDuration,\n        left,\n        right,\n        top,\n        bottom,\n        width,\n        height\n      );\n      animateAttractorInCircle(\n        particles.attractor0,\n        elapsed,\n        attractorLoopDuration,\n        width,\n        height\n      );\n    });\n  }\n  function animateEmitterOnRectangle(emitter, elapsed, duration, left, right, top, bottom, width, height) {\n    const perimeter = 2 * width + 2 * height;\n    const progress = elapsed % duration / duration;\n    const topFrac = width / perimeter;\n    const leftFrac = height / perimeter;\n    const bottomFrac = width / perimeter;\n    let x, y;\n    if (progress < topFrac) {\n      const t = progress / topFrac;\n      x = right - t * width;\n      y = top;\n    } else if (progress < topFrac + leftFrac) {\n      const t = (progress - topFrac) / leftFrac;\n      x = left;\n      y = top - t * height;\n    } else if (progress < topFrac + leftFrac + bottomFrac) {\n      const t = (progress - topFrac - leftFrac) / bottomFrac;\n      x = left + t *
