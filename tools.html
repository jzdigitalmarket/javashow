<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>60 AI Tools - The Ultimate AI Toolkit</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #050714;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.18), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(112, 0, 255, 0.15), transparent 45%),
        radial-gradient(circle at 20% 80%, rgba(0, 242, 254, 0.08), transparent 40%),
        linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      background-position: 0 0, 0 0, 0 0, -1px -1px, -1px -1px;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7000ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
      margin-bottom: 10px;
    }

    header p {
      color: #94a3b8;
      font-size: 1.1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .category-section {
      margin-bottom: 45px;
    }

    .category-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .tool-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(0, 242, 254, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      text-decoration: none;
      color: #ffffff;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .tool-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .tool-card:hover::before {
      left: 100%;
    }

    .tool-card:hover {
      background: rgba(15, 23, 42, 0.85);
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.25), inset 0 0 10px rgba(0, 242, 254, 0.1);
      transform: translateY(-3px);
    }

    .tool-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tool-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tool-name {
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .tool-desc {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

    const container = document.getElementById('categories-container');

    toolkitData.forEach(cat => {
      const section = document.createElement('section');
      section.className = 'category-section';

      const title = document.createElement('h2');
      title.className = 'category-title';
      title.textContent = cat.category;
      section.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'tools-grid';

      cat.tools.forEach(tool => {
        const card = document.createElement('a');
        card.className = 'tool-card';
        card.href = `https://${tool.domain}`;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        const faviconUrl = `https://www.google.com/s2/favicons?domain=${tool.domain}&sz=64`;
        const fallbackSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2300f2fe' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2'/></svg>";

        card.innerHTML = `
          <img src="${faviconUrl}" 
               alt="${tool.name} logo" 
               class="tool-icon" 
               loading="lazy" 
               onerror="this.src='${fallbackSvg}'">
          <div class="tool-info">
            <span class="tool-name">${tool.name}</span>
            <span class="tool-desc">${tool.desc}</span>
          </div>
        `;

        grid.appendChild(card);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });

</body>
</html>
