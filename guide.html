<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compêndio Digital 1946 - Menu 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #120e0a;
            font-family: 'Courier New', Courier, monospace;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Header Vintage Overlay */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #f1e2c3;
            pointer-events: none;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
        #ui-overlay h1 {
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 2px solid #c59b27;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        #ui-overlay p {
            font-size: 0.9rem;
            color: #a89470;
        }
        /* Efeito de Vinheta e Textura Vintage */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 5;
        }
        #tooltip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 20, 10, 0.9);
            border: 1px solid #c59b27;
            color: #f1e2c3;
            padding: 10px 20px;
            font-size: 0.95rem;
            pointer-events: none;
            display: none;
            z-index: 10;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Compêndio de Ferramentas Úteis</h1>
        <p>Arraste para navegar • Clique em uma ficha para acessar o site</p>
    </div>

    <div id="tooltip"></div>
    <div class="vignette"></div>
    <div id="webgl-container"></div>

    <!-- Bibliotecas Three.js e OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. BASE DE DADOS DOS 50 SITES ---
        const database = [
            {
                category: "ARTIGOS, LIVROS E APRENDIZADO",
                items: [
                    { name: "12ft.io", desc: "Burlar paywalls de notícias e artigos", url: "https://12ft.io" },
                    { name: "libgen.is", desc: "Download gratuito de livros didáticos", url: "https://libgen.is" },
                    { name: "sci-hub.se", desc: "Acesso a artigos científicos", url: "https://sci-hub.se" },
                    { name: "gutenberg.org", desc: "Biblioteca de e-books de domínio público", url: "https://gutenberg.org" },
                    { name: "pdfdrive.com", desc: "Motor de busca de livros em PDF", url: "https://pdfdrive.com" },
                    { name: "openculture.com", desc: "Cursos gratuitos de universidades", url: "https://openculture.com" },
                    { name: "wolframalpha.com", desc: "Conhecimento computacional e matemática", url: "https://wolframalpha.com" },
                    { name: "connectedpapers.com", desc: "Mapeamento visual de artigos acadêmicos", url: "https://connectedpapers.com" },
                    { name: "semanticscholar.org", desc: "Busca acadêmica baseada em IA", url: "https://semanticscholar.org" },
                    { name: "scispace.com", desc: "Leitura simplificada de artigos", url: "https://typeset.io" }
                ]
            },
            {
                category: "EDIÇÃO DE IMAGEM & DESIGN",
                items: [
                    { name: "photopea.com", desc: "Editor de fotos completo (estilo Photoshop)", url: "https://photopea.com" },
                    { name: "squoosh.app", desc: "Compressão e otimização de imagens", url: "https://squoosh.app" },
                    { name: "ezgif.com", desc: "Criação e edição de GIFs animados", url: "https://ezgif.com" },
                    { name: "remove.bg", desc: "Remoção automática de fundo de fotos", url: "https://remove.bg" },
                    { name: "unscreen.com", desc: "Remoção automática de fundo de vídeos", url: "https://unscreen.com" },
                    { name: "cleanup.picture", desc: "Remoção de objetos indesejados em fotos", url: "https://cleanup.picture" },
                    { name: "shots.so", desc: "Gerador de mockups de telas e produtos", url: "https://shots.so" },
                    { name: "tineye.com", desc: "Busca reversa de imagens", url: "https://tineye.com" }
                ]
            },
            {
                category: "SEGURANÇA & PRIVACIDADE",
                items: [
                    { name: "haveibeenpwned.com", desc: "Checar vazamento de senhas e e-mails", url: "https://haveibeenpwned.com" },
                    { name: "virustotal.com", desc: "Análise de arquivos e URLs contra vírus", url: "https://virustotal.com" },
                    { name: "privnote.com", desc: "Notas salvas criptografadas autodestrutivas", url: "https://privnote.com" },
                    { name: "temp-mail.org", desc: "Gerador de e-mails descartáveis", url: "https://temp-mail.org" },
                    { name: "file.io", desc: "Compartilhamento de arquivos temporários", url: "https://file.io" },
                    { name: "archive.org", desc: "Preservação e consulta de histórico da web", url: "https://archive.org" },
                    { name: "downdetector.com", desc: "Checagem de queda de serviços online", url: "https://downdetector.com" },
                    { name: "fast.com", desc: "Teste rápido de velocidade de conexão", url: "https://fast.com" }
                ]
            },
            {
                category: "DESENVOLVIMENTO & CÓDIGO",
                items: [
                    { name: "alternativeto.net", desc: "Busca de alternativas gratuitas de softwares", url: "https://alternativeto.net" },
                    { name: "phind.com", desc: "Busca com IA focada em programação", url: "https://phind.com" },
                    { name: "regex101.com", desc: "Testador de Expressões Regulares", url: "https://regex101.com" },
                    { name: "codebeautify.org", desc: "Formatação e visualização limpa de código", url: "https://codebeautify.org" },
                    { name: "explainshell.com", desc: "Explicação detalhada de comandos terminal", url: "https://explainshell.com" }
                ]
            },
            {
                category: "ÁUDIO, MÍDIA E FOCO",
                items: [
                    { name: "justwatch.com", desc: "Guia de filmes e séries em streaming", url: "https://justwatch.com" },
                    { name: "radio.garden", desc: "Navegação por rádios ao vivo do mundo 3D", url: "https://radio.garden" },
                    { name: "everynoise.com", desc: "Mapeamento interativo de gêneros musicais", url: "https://everynoise.com" },
                    { name: "tunefind.com", desc: "Identificação de músicas de filmes e séries", url: "https://tunefind.com" },
                    { name: "musicforprogramming.net", desc: "Áudios e ruídos para foco e trabalho", url: "https://musicforprogramming.net" }
                ]
            },
            {
                category: "PDFs & ORGANIZAÇÃO",
                items: [
                    { name: "summarize.tech", desc: "Resumos por IA de vídeos do YouTube", url: "https://summarize.tech" },
                    { name: "raindrop.io", desc: "Gerenciador de favoritos e links", url: "https://raindrop.io" },
                    { name: "smallpdf.com", desc: "Ferramentas para editar e converter PDFs", url: "https://smallpdf.com" },
                    { name: "ilovepdf.com", desc: "Juntar, dividir e comprimir arquivos PDF", url: "https://ilovepdf.com" }
                ]
            }
        ];

        // --- 2. CONFIGURAÇÃO DA CENA THREE.JS ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x14100c);
        scene.fog = new THREE.FogExp2(0x14100c, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Não passar do chão
        controls.minDistance = 10;
        controls.maxDistance = 80;

        // --- 3. ILUMINAÇÃO VINTAGE (Luz Quente / Sombra) ---
        const ambientLight = new THREE.AmbientLight(0xffecd6, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffdfa9, 1.2);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xd97724, 0.8, 50);
        pointLight.position.set(-10, 10, -10);
        scene.add(pointLight);

        // Chão de Madeira Escura / Mesa Retro
        const floorGeo = new THREE.PlaneGeometry(150, 150);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f1610, roughness: 0.8, metalness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -8;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 4. GERADOR DE TEXTURA CANVAS (Estilo Cartão 1940) ---
        function createCardTexture(title, categoryName) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 320;
            const ctx = canvas.getContext('2d');

            // Fundo de papel antigo / sepia
            ctx.fillStyle = '#eadecc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Moldura interna clássica
            ctx.strokeStyle = '#3d2817';
            ctx.lineWidth = 8;
            ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);
            
            ctx.lineWidth = 2;
            ctx.strokeRect(22, 22, canvas.width - 44, canvas.height - 44);

            // Cabeçalho da Categoria
            ctx.fillStyle = '#3d2817';
            ctx.fillRect(24, 24, canvas.width - 48, 45);

            ctx.fillStyle = '#eadecc';
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(categoryName.substring(0, 32), canvas.width / 2, 52);

            // Nome do Serviço (Centro)
            ctx.fillStyle = '#1c120c';
            ctx.font = 'bold 28px "Courier New", monospace';
            ctx.fillText(title, canvas.width / 2, 170);

            // Selo / Detalhe Inferior
            ctx.strokeStyle = '#8c2d19';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 245, 25, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#8c2d19';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.fillText('1946', canvas.width / 2, 249);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- 5. CRIAÇÃO DOS CARTÕES 3D NA CENA ---
        const clickableObjects = [];
        const cardGeometry = new THREE.BoxGeometry(4.5, 3, 0.1);

        const numCategories = database.length;
        const colSpacing = 9; // Espaçamento entre colunas
        const rowSpacing = 3.8; // Espaçamento vertical

        database.forEach((cat, colIdx) => {
            const xPos = (colIdx - (numCategories - 1) / 2) * colSpacing;

            cat.items.forEach((item, rowIdx) => {
                const texture = createCardTexture(item.name, cat.category);
                
                // Materiais: Frente com textura, lados com papel escuro
                const materials = [
                    new THREE.MeshStandardMaterial({ color: 0xc4b299 }), // direita
                    new THREE.MeshStandardMaterial({ color: 0xc4b299 }), // esquerda
                    new THREE.MeshStandardMaterial({ color: 0xc4b299 }), // topo
                    new THREE.MeshStandardMaterial({ color: 0xc4b299 }), // base
                    new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6 }), // frente
                    new THREE.MeshStandardMaterial({ color: 0xa8967d })  // verso
                ];

                const card = new THREE.Mesh(cardGeometry, materials);
                
                // Disposição em grade inclinada (tipo fichário)
                const yPos = (cat.items.length - rowIdx) * 1.2 - 2;
                const zPos = rowIdx * 2.2 - (cat.items.length * 1.1);

                card.position.set(xPos, yPos, zPos);
                card.rotation.x = -Math.PI / 12; // Leve inclinação para trás
                card.castShadow = true;
                card.receiveShadow = true;

                // Metadados anexados ao objeto 3D
                card.userData = {
                    name: item.name,
                    desc: item.desc,
                    url: item.url,
                    category: cat.category,
                    originalPos: card.position.clone(),
                    originalRot: card.rotation.clone()
                };

                scene.add(card);
                clickableObjects.push(card);
            });
        });

        // --- 6. RAYCASTING E INTERAÇÃO COM MOUSE ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        let hoveredObject = null;

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                const obj = intersects[0].object;

                if (hoveredObject !== obj) {
                    resetHovered();
                    hoveredObject = obj;
                    
                    // Animação de elevação da ficha ao passar o mouse
                    document.body.style.cursor = 'pointer';
                    obj.position.z += 0.8;
                    obj.position.y += 0.4;
                    obj.rotation.x = 0; // Fica reta para o usuário

                    // Atualiza Tooltip
                    tooltip.style.display = 'block';
                    tooltip.innerHTML = `<strong>${obj.userData.name}</strong><br>${obj.userData.desc}`;
                }
            } else {
                resetHovered();
            }
        }

        function resetHovered() {
            if (hoveredObject) {
                document.body.style.cursor = 'default';
                hoveredObject.position.copy(hoveredObject.userData.originalPos);
                hoveredObject.rotation.copy(hoveredObject.userData.originalRot);
                hoveredObject = null;
                tooltip.style.display = 'none';
            }
        }

        function onMouseClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                const targetUrl = intersects[0].object.userData.url;
                window.open(targetUrl, '_blank');
            }
        }

        window.addEventListener('mousemove', onMouseMove, false);
        window.addEventListener('click', onMouseClick, false);

        // --- 7. REDIMENSIONAMENTO E LOOP DE RENDERIZAÇÃO ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
